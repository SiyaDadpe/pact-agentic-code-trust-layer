<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="PACT evaluation metrics bar chart">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f9e8f"/>
      <stop offset="100%" stop-color="#4aa3d4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1098" height="558" rx="14" fill="#ffffff" stroke="#d8dee4" stroke-width="2"/>
  <text x="40" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Detection performance on a frozen blind test</text>
  <text x="40" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#57606a">DataDog malicious packages + legitimate npm packages · 1,840 packages still on npm · run once</text>

  <g stroke="#eaeef2" stroke-width="1">
    <line x1="250" y1="104" x2="250" y2="456"/>
    <line x1="435" y1="104" x2="435" y2="456"/>
    <line x1="620" y1="104" x2="620" y2="456"/>
    <line x1="805" y1="104" x2="805" y2="456"/>
    <line x1="990" y1="104" x2="990" y2="456"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">
    <text x="250" y="481">0%</text>
    <text x="435" y="481">25%</text>
    <text x="620" y="481">50%</text>
    <text x="805" y="481">75%</text>
    <text x="990" y="481">100%</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#374151" text-anchor="end">
    <text x="232" y="136">Accuracy</text>
    <text x="232" y="196">Precision</text>
    <text x="232" y="256">Recall</text>
    <text x="232" y="316">Specificity</text>
    <text x="232" y="376">F1 score</text>
    <text x="232" y="436">MCC</text>
  </g>

  <g fill="url(#bar)">
    <rect x="250" y="116" width="738" height="30" rx="6"/>
    <rect x="250" y="176" width="740" height="30" rx="6"/>
    <rect x="250" y="236" width="735" height="30" rx="6"/>
    <rect x="250" y="296" width="740" height="30" rx="6"/>
    <rect x="250" y="356" width="737" height="30" rx="6"/>
    <rect x="250" y="416" width="735" height="30" rx="6"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f6f68">
    <text x="1002" y="137">99.67</text>
    <text x="1002" y="197">100.00</text>
    <text x="1002" y="257">99.33</text>
    <text x="1002" y="317">100.00</text>
    <text x="1002" y="377">99.66</text>
    <text x="1002" y="437">99.35</text>
  </g>

  <line x1="40" y1="506" x2="1060" y2="506" stroke="#eaeef2" stroke-width="1"/>
  <text x="40" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">F1 and MCC are shown as percentages. Primary metric treats BLOCK as the positive prediction.</text>
</svg>
